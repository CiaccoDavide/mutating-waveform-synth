name: Release Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release with notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mutating Waveform family ${{ github.ref_name }}
          body_path: docs/release-notes-v1.3.0.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Synth
          - app: synth
            path: .
            rust_workspace: './src-tauri -> target'
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - app: synth
            path: .
            rust_workspace: './src-tauri -> target'
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - app: synth
            path: .
            rust_workspace: './src-tauri -> target'
            platform: ubuntu-22.04
            args: ''
          - app: synth
            path: .
            rust_workspace: './src-tauri -> target'
            platform: windows-latest
            args: ''
          # Sequencer
          - app: sequencer
            path: apps/sequencer
            rust_workspace: 'apps/sequencer/src-tauri -> apps/sequencer/src-tauri/target'
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - app: sequencer
            path: apps/sequencer
            rust_workspace: 'apps/sequencer/src-tauri -> apps/sequencer/src-tauri/target'
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - app: sequencer
            path: apps/sequencer
            rust_workspace: 'apps/sequencer/src-tauri -> apps/sequencer/src-tauri/target'
            platform: ubuntu-22.04
            args: ''
          - app: sequencer
            path: apps/sequencer
            rust_workspace: 'apps/sequencer/src-tauri -> apps/sequencer/src-tauri/target'
            platform: windows-latest
            args: ''
          # Modular
          - app: modular
            path: apps/modular
            rust_workspace: 'apps/modular/src-tauri -> apps/modular/src-tauri/target'
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - app: modular
            path: apps/modular
            rust_workspace: 'apps/modular/src-tauri -> apps/modular/src-tauri/target'
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - app: modular
            path: apps/modular
            rust_workspace: 'apps/modular/src-tauri -> apps/modular/src-tauri/target'
            platform: ubuntu-22.04
            args: ''
          - app: modular
            path: apps/modular
            rust_workspace: 'apps/modular/src-tauri -> apps/modular/src-tauri/target'
            platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.path == '.' && 'package-lock.json' || format('{0}/package-lock.json', matrix.path) }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.rust_workspace }}

      - name: Install frontend dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ matrix.path == '.' && '' || matrix.path }}
          tagName: ${{ github.ref_name }}
          releaseName: Mutating Waveform family ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        run: npx tauri android build --apk --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Sign APK (debug keystore for sideload)
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          UNSIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          OUT="Mutating-Waveform-Synth-${VERSION}-android-universal.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          KS="${HOME}/.android/debug.keystore"
          mkdir -p "${HOME}/.android"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$UNSIGNED"
          ALIGNED="${UNSIGNED%.apk}-aligned.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --out "$OUT" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
