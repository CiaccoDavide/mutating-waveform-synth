[package]
name = "mutating-pattern-sequencer"
version = "1.3.0"
description = "MIDI pattern sequencer companion for Mutating Waveform Synth"
authors = ["CiaccoDavide"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mutating_pattern_sequencer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
